<svg id="gd2" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" viewBox="-4 -4 897.6875 100.5625" role="graphics-document document" aria-roledescription="flowchart-v2" style="max-width: 897.6875px;"><rect width="100%" height="100%" fill="white"/><style>#gd2{font-family:&quot;trebuchet ms&quot;,verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#gd2 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#gd2 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#gd2 .error-icon{fill:#552222;}#gd2 .error-text{fill:#552222;stroke:#552222;}#gd2 .edge-thickness-normal{stroke-width:1px;}#gd2 .edge-thickness-thick{stroke-width:3.5px;}#gd2 .edge-pattern-solid{stroke-dasharray:0;}#gd2 .edge-thickness-invisible{stroke-width:0;fill:none;}#gd2 .edge-pattern-dashed{stroke-dasharray:3;}#gd2 .edge-pattern-dotted{stroke-dasharray:2;}#gd2 .marker{fill:#333333;stroke:#333333;}#gd2 .marker.cross{stroke:#333333;}#gd2 svg{font-family:&quot;trebuchet ms&quot;,verdana,arial,sans-serif;font-size:16px;}#gd2 p{margin:0;}#gd2 .label{font-family:&quot;trebuchet ms&quot;,verdana,arial,sans-serif;color:#333;}#gd2 .cluster-label text{fill:#333;}#gd2 .cluster-label span{color:#333;}#gd2 .cluster-label span p{background-color:transparent;}#gd2 .label text,#gd2 span{fill:#333;color:#333;}#gd2 .node rect,#gd2 .node circle,#gd2 .node ellipse,#gd2 .node polygon,#gd2 .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#gd2 .rough-node .label text,#gd2 .node .label text,#gd2 .image-shape .label,#gd2 .icon-shape .label{text-anchor:middle;}#gd2 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#gd2 .rough-node .label,#gd2 .node .label,#gd2 .image-shape .label,#gd2 .icon-shape .label{text-align:center;}#gd2 .node.clickable{cursor: